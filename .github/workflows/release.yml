name: release

# Em cada tag vX.Y.Z: compila binários Linux (amd64/arm64) e anexa ao Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: test
        run: go test ./...

      - name: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          OUT="backify-bridge_linux_${{ matrix.goarch }}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${OUT}" ./cmd/backify-bridge
          (cd dist && sha256sum "${OUT}" > "${OUT}.sha256")

      - name: upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/backify-bridge_linux_${{ matrix.goarch }}
            dist/backify-bridge_linux_${{ matrix.goarch }}.sha256
