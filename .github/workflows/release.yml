name: release

# Em cada tag vX.Y.Z: compila binários Linux (amd64/arm64), anexa ao Release e
# publica a imagem oficial no GHCR (ghcr.io/backifyapp/bridge).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: test
        run: go test ./...

      - name: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          OUT="backify-bridge_linux_${{ matrix.goarch }}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${OUT}" ./cmd/backify-bridge
          (cd dist && sha256sum "${OUT}" > "${OUT}.sha256")

      - name: upload to release
        uses: softprops/action-gh-release@v2
        with:
          # Notas geradas dos commits; o CHANGELOG.md tem o histórico curado.
          generate_release_notes: true
          files: |
            dist/backify-bridge_linux_${{ matrix.goarch }}
            dist/backify-bridge_linux_${{ matrix.goarch }}.sha256

  image:
    # Imagem oficial (inclui docker-cli, necessária para o modo docker).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/backifyapp/bridge:${{ github.ref_name }}
            ghcr.io/backifyapp/bridge:latest
